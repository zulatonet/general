# Só para TESTE LOCAL (sobe um Postgres junto). O Easypanel não usa este
# arquivo — lá o banco é externo (Supabase/Neon) e o build usa só o
# Dockerfile.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditoria
      POSTGRES_PASSWORD: auditoria
      POSTGRES_DB: auditoria_bu
    ports:
      - "5434:5432"
    volumes:
      - auditoria_bu_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditoria -d auditoria_bu"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://auditoria:auditoria@db:5432/auditoria_bu
      SESSION_SECRET: teste-local-troque-depois
      MODERACAO_SENHA: teste-local-troque-depois

volumes:
  auditoria_bu_db:
