<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sala de Bate-Papo</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a12">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #1e1e2f; color: #eee;
  display: flex; flex-direction: column;
  font-size: 16px;
}
button { font-family: inherit; }
#topo { padding: 10px 12px; background: #0a0a12; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
#topo-esq { display: flex; align-items: center; gap: 10px; min-width: 0; }
#menu { display: none; position: relative; background: none; border: 1px solid #444; color: #eee; border-radius: 8px; padding: 4px 10px; font-size: 18px; cursor: pointer; }
#menu .ponto { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ff5252; }
#meunome { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sair { background: none; border: 1px solid #444; color: #aac; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; flex-shrink: 0; }
#aviso-app { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2a2a55; font-size: 13px; color: #dde; flex-shrink: 0; }
#aviso-app span { flex: 1; min-width: 0; }
#aviso-app button { white-space: nowrap; flex-shrink: 0; border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: bold; cursor: pointer; background: #6a6ad0; color: white; }
#aviso-app #aviso-fechar { background: none; color: #99a; padding: 4px 6px; font-size: 16px; }
#corpo { flex: 1; display: flex; overflow: hidden; min-height: 0; position: relative; }

/* Barra lateral */
#sidebar { width: 250px; background: #14141f; display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; }
#busca-caixa { padding: 8px; flex-shrink: 0; }
#busca { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #333; background: #1e1e2f; color: #eee; font-size: 14px; }
#lista { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.secao { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .03em; }
.secao button { background: #2a2a3f; border: none; color: #cce; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; text-transform: none; }
.dica-vazia { font-size: 12px; color: #667; padding: 2px 8px 6px; }
.item { padding: 9px 8px; cursor: pointer; border-radius: 8px; margin-bottom: 3px; font-size: 14px; line-height: 1.2; user-select: none; display: flex; align-items: center; gap: 7px; }
.item:hover { background: #1f1f30; }
.item.selecionado { background: #4a4a8f; }
.item.mural { background: #2a5a3f; }
.item.mural.selecionado { background: #3a8a5f; }
.item .nome-item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.fora { color: #99a; }
.item .sub { font-size: 11px; color: #778; }
.pino { background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 4px; opacity: .25; flex-shrink: 0; }
.pino.fixo { opacity: 1; }
.item:hover .pino { opacity: .7; }
.item:hover .pino.fixo { opacity: 1; }
.bolinha { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.bolinha.online { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
.bolinha.offline { background: #f44336; }
.bolinha.conectando { background: #ffb300; }
.badge-nao-lidas { background: #ff5252; color: white; font-size: 11px; font-weight: bold; border-radius: 10px; padding: 1px 6px; flex-shrink: 0; }
.mais { font-size: 12px; color: #778; padding: 6px 8px; }

/* Conversa */
#chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#chat-titulo { padding: 8px 12px; background: #0a0a12; border-bottom: 1px solid #222; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
#titulo-textos { flex: 1; min-width: 0; }
#titulo-nome { font-size: 15px; color: #dde; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#titulo-sub { font-size: 12px; color: #889; margin-top: 2px; }
#titulo-acao { background: none; border: 1px solid #553; color: #ec8; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
#mensagens { flex: 1; padding: 12px; overflow-y: auto; }
.msg { margin-bottom: 8px; padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 16px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
.msg.enviada { background: #4a4a8f; margin-left: auto; }
.msg.recebida { background: #2a2a3f; }
.msg.sistema { background: #333; color: #bbb; font-size: 13px; text-align: center; margin: 8px auto; max-width: 100%; }
.msg.confirmacao { background: #2a5a3f; color: #cfc; font-size: 13px; text-align: left; margin: 8px auto; max-width: 100%; font-family: monospace; }
.msg .nome { font-weight: bold; font-size: 13px; color: #aac; margin-bottom: 2px; }
.msg .hora { font-size: 11px; color: #999; margin-top: 4px; }
.vazio { text-align: center; color: #667; font-size: 13px; margin-top: 30px; }
#form { display: flex; align-items: flex-end; padding: 8px; background: #14141f; gap: 6px; flex-shrink: 0; }
#texto { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; font-size: 16px; font-family: inherit; line-height: 1.3; background: #1e1e2f; color: #eee; min-width: 0; resize: none; height: 46px; max-height: 160px; overflow-y: auto; }
#texto:disabled { opacity: 0.5; }
#enviar { padding: 12px 16px; border: none; border-radius: 8px; background: #4a4a8f; color: white; cursor: pointer; font-size: 16px; font-weight: bold; }
#enviar:disabled { opacity: 0.5; }

/* Modais */
.modal {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.modal .caixa {
  background: #2a2a3f; padding: 26px; border-radius: 16px; max-width: 90%;
  width: 400px; text-align: center; position: relative;
}
.modal h2 { margin: 0 0 8px 0; font-size: 20px; }
.modal .dica { color: #99a; font-size: 13px; margin-bottom: 16px; }
.modal input {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444;
  font-size: 16px; background: #1e1e2f; color: #eee; margin-bottom: 12px;
}
.modal button.principal {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  background: #4a4a8f; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
}
.modal button.secundario {
  width: 100%; padding: 12px; border: 1px solid #4a4a8f; border-radius: 8px;
  background: none; color: #ccf; font-size: 15px; font-weight: bold; cursor: pointer;
}
.modal button:disabled { opacity: 0.5; }
.modal .fechar { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #99a; font-size: 20px; cursor: pointer; }
.modal .erro { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
.modal .info { color: #8c8; font-size: 13px; min-height: 18px; margin-top: 10px; }
.modal .ou { color: #667; font-size: 12px; margin: 14px 0; }
.escondido { display: none !important; }

/* Celular: barra lateral vira menu deslizante */
#veu { display: none; }
@media (max-width: 700px) {
  #menu { display: block; }
  #sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 85%; max-width: 320px; z-index: 50;
    transform: translateX(-100%); transition: transform .2s ease; box-shadow: 4px 0 20px rgba(0,0,0,.5);
  }
  #sidebar.aberto { transform: translateX(0); }
  #veu.aberto { display: block; position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
}
</style>
</head>
<body>
<div id="modal-nome" class="modal escondido">
  <form class="caixa" id="modal-form">
    <h2>Entrar no chat</h2>
    <div class="dica">Primeira vez? Escolha um nome e uma senha — a conta é criada na hora.</div>
    <div class="erro" id="modal-erro"></div>
    <input id="modal-input" placeholder="Seu nome" maxlength="20" autocomplete="username" autocapitalize="off">
    <input id="modal-senha" type="password" placeholder="Senha (mínimo 6 caracteres)" maxlength="128" autocomplete="current-password">
    <button id="modal-btn" class="principal" type="submit">Entrar</button>
  </form>
</div>

<div id="modal-criar" class="modal escondido">
  <form class="caixa" id="criar-form">
    <button type="button" class="fechar" data-fechar>✕</button>
    <h2>Criar sala</h2>
    <div class="dica">A sala aparece para todos. Quem tiver a senha entra direto; os outros pedem para você.</div>
    <div class="erro" id="criar-erro"></div>
    <input id="criar-nome" placeholder="Nome da sala (sem espaços)" maxlength="20" autocomplete="off" autocapitalize="off">
    <input id="criar-senha" type="password" placeholder="Senha da sala (mínimo 4)" maxlength="128" autocomplete="new-password">
    <button class="principal" type="submit">Criar</button>
  </form>
</div>

<div id="modal-sala" class="modal escondido">
  <div class="caixa">
    <button type="button" class="fechar" data-fechar>✕</button>
    <h2 id="sala-titulo">🔒 Sala</h2>
    <div class="dica" id="sala-dica"></div>
    <div class="erro" id="sala-erro"></div>
    <form id="sala-form">
      <input id="sala-senha" type="password" placeholder="Senha da sala" maxlength="128" autocomplete="off">
      <button class="principal" type="submit">Entrar com senha</button>
    </form>
    <div class="ou">— ou —</div>
    <button class="secundario" id="sala-solicitar">Solicitar entrada</button>
    <div class="info" id="sala-info"></div>
  </div>
</div>

<div id="topo">
  <div id="topo-esq">
    <button id="menu" aria-label="Conversas">☰<span class="ponto escondido" id="menu-ponto"></span></button>
    <div id="meunome"><span id="status" class="bolinha conectando"></span><span id="nome-texto">Conectando...</span></div>
  </div>
  <button id="sair" class="escondido">Sair</button>
</div>
<div id="aviso-app" class="escondido">
  <span id="aviso-texto"></span>
  <button id="btn-notif" class="escondido">🔔 Ativar notificações</button>
  <button id="btn-instalar" class="escondido">📲 Instalar app</button>
  <button id="aviso-fechar" aria-label="Fechar">✕</button>
</div>
<div id="corpo">
  <div id="veu"></div>
  <div id="sidebar">
    <div id="busca-caixa"><input id="busca" placeholder="🔍 Buscar pessoas e salas" autocomplete="off"></div>
    <div id="lista"></div>
  </div>
  <div id="chat">
    <div id="chat-titulo">
      <div id="titulo-textos"><div id="titulo-nome">📢 Mural de Recados</div><div id="titulo-sub"></div></div>
      <button id="titulo-acao" class="escondido"></button>
    </div>
    <div id="mensagens"></div>
    <div id="form">
      <textarea id="texto" rows="1" placeholder="Mensagem..." disabled autocomplete="off" maxlength="2000"></textarea>
      <button id="enviar" disabled>Enviar</button>
    </div>
  </div>
</div>
<script>
// Limpa dados da versão antiga (identificação por device_id)
try { localStorage.removeItem("chat_device_id"); localStorage.removeItem("chat_nome"); } catch (e) {}

const MURAL = "MURAL";
const LIMITE_LISTA = 200;   // máximo de pessoas renderizadas em "Todos" sem busca
const ADMIN = 1, MASTER = 2;

let ws = null;
let meuNome = "";
let meuPapel = 0;
let ttlHoras = 24;
let bloqueadoAte = null;
let timerDesbloqueio = null;
let selecionado = MURAL;
let conversas = {};
let naoLidas = {};
let usuarios = new Map();   // apelido -> online
let contatos = new Set();
let salas = new Map();      // nome -> {nome, dono, membros, membro}
let salaModal = null;
let tentativas = 0;
let timerReconexao = null;

const el = (id) => document.getElementById(id);
const chaveUsuario = (nome) => "u:" + nome;
const chaveSala = (nome) => "s:" + nome;
const ehSala = (k) => k.startsWith("s:");
const ehPrivada = (k) => k.startsWith("u:");
const nomeDaChave = (k) => k.slice(2);
const conectado = () => ws && ws.readyState === WebSocket.OPEN;

function enviarWs(dados) { if (conectado()) ws.send(JSON.stringify(dados)); }

function definirStatus(estado, texto) {
  el("status").className = "bolinha " + estado;
  el("nome-texto").textContent = texto;
}

function atualizarNomeTopo() {
  const selo = meuPapel === MASTER ? " 👑" : meuPapel === ADMIN ? " 🛡️" : "";
  definirStatus("online", meuNome + selo);
}

function mostrarLogin(erro) {
  el("modal-erro").textContent = erro || "";
  el("modal-nome").classList.remove("escondido");
  el("sair").classList.add("escondido");
  definirStatus("offline", "Desconectado");
  atualizarEntrada();
  el("modal-input").focus();
}

function paraMsgs(lista) {
  return (lista || []).map(m => ({
    remetente: m.remetente, texto: m.texto, hora: m.hora,
    classe: m.remetente === meuNome ? "enviada" : "recebida"
  }));
}

function empurrar(chave, m) {
  if (!conversas[chave]) conversas[chave] = [];
  conversas[chave].push(m);
}

// ---------------------------------------------------------------
// Conexão
// ---------------------------------------------------------------
function conectar() {
  clearTimeout(timerReconexao);
  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(protocolo + "//" + location.host + "/ws");
  definirStatus("conectando", "Conectando...");

  ws.onmessage = (event) => {
    const d = JSON.parse(event.data);
    const trata = TRATADORES[d.tipo];
    if (trata) trata(d);
  };

  ws.onclose = (event) => {
    atualizarEntrada();
    if (event.code === 4001) {
      ws = null;
      mostrarLogin(meuNome ? "Sua sessão foi encerrada. Entre novamente." : "");
      meuNome = "";
      return;
    }
    if (!ws) return;  // saída manual
    tentativas++;
    const espera = Math.min(30000, 1000 * 2 ** Math.min(tentativas, 5));
    definirStatus("conectando", "Reconectando...");
    timerReconexao = setTimeout(conectar, espera);
  };
}

const TRATADORES = {
  bemvindo(d) {
    tentativas = 0;
    meuNome = d.nome;
    meuPapel = d.papel;
    ttlHoras = d.ttl_horas;
    definirBloqueio(d.bloqueado_ate);
    atualizarNomeTopo();
    el("modal-nome").classList.add("escondido");
    el("sair").classList.remove("escondido");
    conversas = { [MURAL]: paraMsgs(d.historico.mural) };
    for (const [quem, msgs] of Object.entries(d.historico.privadas || {})) conversas[chaveUsuario(quem)] = paraMsgs(msgs);
    for (const [sala, msgs] of Object.entries(d.historico.salas || {})) conversas[chaveSala(sala)] = paraMsgs(msgs);
    naoLidas = {};
    for (const [quem, qtd] of Object.entries(d.nao_lidas || {})) naoLidas[chaveUsuario(quem)] = qtd;
    usuarios = new Map(d.usuarios.map(u => [u.apelido, u.online]));
    contatos = new Set(d.contatos);
    salas = new Map(d.salas.map(s => [s.nome, s]));
    const aindaExiste = selecionado === MURAL || (ehSala(selecionado) ? salas.get(nomeDaChave(selecionado))?.membro : usuarios.has(nomeDaChave(selecionado)));
    selecionar(aindaExiste ? selecionado : MURAL, false);
    enviarVisibilidade();
    if (conversaPendente) { abrirChave(conversaPendente); conversaPendente = null; }
    if (pushSuportado && Notification.permission === "granted") inscreverPush();
    atualizarAviso();
  },
  erro(d) { adicionarSistema(d.mensagem); },
  sistema(d) { adicionarSistema(d.mensagem); },
  comando_ok(d) { adicionar(selecionado, { texto: d.mensagem, classe: "confirmacao" }); },
  presenca(d) { usuarios.set(d.apelido, d.online); renderizarLista(); },
  contatos(d) { contatos = new Set(d.contatos); renderizarLista(); },
  papel(d) { meuPapel = d.papel; atualizarNomeTopo(); atualizarTitulo(); atualizarEntrada(); },
  msg(d) {
    const chave = d.sala ? chaveSala(d.sala) : d.privado ? chaveUsuario(d.de) : MURAL;
    const minha = d.de === meuNome;
    empurrar(chave, { remetente: d.de, texto: d.texto, hora: d.hora, classe: minha ? "enviada" : "recebida" });
    if (selecionado === chave) {
      renderizarConversa();
      if (d.privado) enviarWs({ tipo: "marcar_lidas", interlocutor: d.de });
    } else if (!minha && chave !== MURAL) {
      naoLidas[chave] = (naoLidas[chave] || 0) + 1;
      tocarSom();
    }
    renderizarLista();
  },
  msg_enviada(d) {
    empurrar(chaveUsuario(d.para), { remetente: meuNome, texto: d.texto, hora: d.hora, classe: "enviada" });
    if (selecionado === chaveUsuario(d.para)) renderizarConversa();
  },
  renomeado(d) { renomear(d.de, d.para); },
  apagado(d) { aplicarApagado(d); },
  bloqueado(d) { definirBloqueio(d.ate); adicionarSistema(d.mensagem + (bloqueadoAte ? " Liberado em " + formatarHora(d.ate) + "." : "")); },
  desbloqueado(d) { definirBloqueio(null); adicionarSistema(d.mensagem); },
  sala_atualizada(d) {
    const atual = salas.get(d.nome);
    salas.set(d.nome, { nome: d.nome, dono: d.dono, membros: d.membros, membro: atual ? atual.membro : d.dono === meuNome });
    if (salaModal === d.nome) preencherModalSala();
    renderizarLista();
    if (selecionado === chaveSala(d.nome)) atualizarTitulo();
  },
  sala_entrou(d) {
    const s = salas.get(d.nome) || { nome: d.nome, dono: meuNome, membros: 1 };
    s.membro = true;
    salas.set(d.nome, s);
    conversas[chaveSala(d.nome)] = paraMsgs(d.historico);
    if (salaModal === d.nome || d.criada) {
      fecharModais();
      selecionar(chaveSala(d.nome));
    } else {
      renderizarLista();
    }
  },
  sala_saiu(d) { sairDaSala(d.nome, d.mensagem); },
  sala_apagada(d) {
    const eraMembro = salas.get(d.nome)?.membro;
    salas.delete(d.nome);
    sairDaSala(d.nome, eraMembro ? "A sala " + d.nome + " foi apagada." : null);
    if (salaModal === d.nome) fecharModais();
  },
  aviso_sala(d) { adicionar(chaveSala(d.sala), { texto: d.mensagem, classe: "sistema" }); },
  erro_sala(d) {
    const alvo = !el("modal-criar").classList.contains("escondido") ? "criar-erro" : !el("modal-sala").classList.contains("escondido") ? "sala-erro" : null;
    if (alvo) el(alvo).textContent = d.mensagem; else adicionarSistema(d.mensagem);
  },
  solicitacao_enviada(d) {
    el("sala-erro").textContent = "";
    el("sala-info").textContent = "📩 Pedido enviado para " + d.dono + ". Você entra assim que for aceito.";
  },
};

function sairDaSala(nome, mensagem) {
  const s = salas.get(nome);
  if (s) s.membro = false;
  delete conversas[chaveSala(nome)];
  delete naoLidas[chaveSala(nome)];
  if (selecionado === chaveSala(nome)) selecionar(MURAL, false);
  if (mensagem) adicionarSistema(mensagem);
  renderizarLista();
}

function definirBloqueio(ate) {
  clearTimeout(timerDesbloqueio);
  bloqueadoAte = ate ? new Date(ate) : null;
  if (bloqueadoAte && bloqueadoAte > new Date()) {
    const ms = bloqueadoAte - new Date();
    if (ms < 2 ** 31) timerDesbloqueio = setTimeout(() => { definirBloqueio(null); adicionarSistema("✅ Envio liberado."); }, ms + 500);
  } else {
    bloqueadoAte = null;
  }
  atualizarEntrada();
}

// ---------------------------------------------------------------
// Login / logout
// ---------------------------------------------------------------
el("modal-form").onsubmit = async (e) => {
  e.preventDefault();
  const apelido = el("modal-input").value.trim();
  const senha = el("modal-senha").value;
  if (!apelido || !senha) {
    el("modal-erro").textContent = "Preencha nome e senha.";
    return;
  }
  el("modal-btn").disabled = true;
  el("modal-erro").textContent = "";
  try {
    const resp = await fetch("/api/entrar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({apelido, senha}),
    });
    const dados = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      el("modal-erro").textContent = dados.erro || "Não foi possível entrar.";
      return;
    }
    el("modal-senha").value = "";
    conectar();
  } catch (err) {
    el("modal-erro").textContent = "Sem conexão com o servidor.";
  } finally {
    el("modal-btn").disabled = false;
  }
};

el("sair").onclick = async () => {
  const antigo = ws;
  ws = null;
  if (antigo) antigo.close();
  await cancelarPush();
  try { await fetch("/api/sair", {method: "POST"}); } catch (e) {}
  meuNome = ""; meuPapel = 0;
  conversas = {}; naoLidas = {}; usuarios = new Map(); contatos = new Set(); salas = new Map();
  selecionado = MURAL;
  definirBloqueio(null);
  renderizarLista();
  renderizarConversa();
  atualizarAviso();
  mostrarLogin();
};

// ---------------------------------------------------------------
// Salas: criar, entrar, solicitar
// ---------------------------------------------------------------
function fecharModais() {
  el("modal-criar").classList.add("escondido");
  el("modal-sala").classList.add("escondido");
  salaModal = null;
}
document.querySelectorAll("[data-fechar]").forEach(b => b.onclick = fecharModais);
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", (e) => {
  if (e.target === m && m.id !== "modal-nome") fecharModais();
}));

function abrirCriarSala() {
  el("criar-erro").textContent = "";
  el("criar-nome").value = ""; el("criar-senha").value = "";
  el("modal-criar").classList.remove("escondido");
  el("criar-nome").focus();
}
el("criar-form").onsubmit = (e) => {
  e.preventDefault();
  const nome = el("criar-nome").value.trim();
  const senha = el("criar-senha").value;
  if (!nome || !senha) { el("criar-erro").textContent = "Preencha nome e senha."; return; }
  el("criar-erro").textContent = "";
  enviarWs({ tipo: "criar_sala", nome, senha });
};

function preencherModalSala() {
  const s = salas.get(salaModal);
  if (!s) return;
  el("sala-titulo").textContent = "🔒 " + s.nome;
  el("sala-dica").textContent = "Criada por " + s.dono + " · " + s.membros + (s.membros === 1 ? " membro" : " membros");
}
function abrirSala(nome) {
  salaModal = nome;
  preencherModalSala();
  el("sala-erro").textContent = ""; el("sala-info").textContent = ""; el("sala-senha").value = "";
  el("modal-sala").classList.remove("escondido");
}
el("sala-form").onsubmit = (e) => {
  e.preventDefault();
  const senha = el("sala-senha").value;
  if (!senha) { el("sala-erro").textContent = "Digite a senha."; return; }
  el("sala-erro").textContent = "";
  enviarWs({ tipo: "entrar_sala", sala: salaModal, senha });
};
el("sala-solicitar").onclick = () => {
  el("sala-erro").textContent = "";
  enviarWs({ tipo: "solicitar_sala", sala: salaModal });
};

el("titulo-acao").onclick = () => {
  if (!ehSala(selecionado)) return;
  const nome = nomeDaChave(selecionado);
  const s = salas.get(nome);
  if (!s) return;
  if (s.dono === meuNome) {
    if (confirm("Apagar a sala " + nome + " e todas as mensagens dela?")) enviarWs({ texto: "/apagarsala " + nome, para: null, sala: null });
  } else if (confirm("Sair da sala " + nome + "?")) {
    enviarWs({ texto: "/sairsala " + nome, para: null, sala: null });
  }
};

// ---------------------------------------------------------------
// Utilidades de conversa
// ---------------------------------------------------------------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function tocarSom() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine"; osc.frequency.value = 880; gain.gain.value = 0.2;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

function adicionar(chave, m) {
  empurrar(chave, { remetente: "", hora: "", ...m });
  if (chave === selecionado) renderizarConversa();
}
function adicionarSistema(texto) { adicionar(selecionado, { texto, classe: "sistema" }); }

function renomear(de, para) {
  if (meuNome === de) { meuNome = para; atualizarNomeTopo(); }
  if (usuarios.has(de)) { usuarios.set(para, usuarios.get(de)); usuarios.delete(de); }
  if (contatos.has(de)) { contatos.delete(de); contatos.add(para); }
  const kDe = chaveUsuario(de), kPara = chaveUsuario(para);
  if (conversas[kDe]) { conversas[kPara] = (conversas[kPara] || []).concat(conversas[kDe]); delete conversas[kDe]; }
  if (naoLidas[kDe]) { naoLidas[kPara] = naoLidas[kDe]; delete naoLidas[kDe]; }
  for (const msgs of Object.values(conversas)) msgs.forEach(m => { if (m.remetente === de) m.remetente = para; });
  for (const s of salas.values()) if (s.dono === de) s.dono = para;
  if (selecionado === kDe) selecionar(kPara, false); else { renderizarLista(); renderizarConversa(); atualizarTitulo(); }
}

function aplicarApagado(d) {
  if (d.escopo === "mural") conversas[MURAL] = [];
  else if (d.escopo === "privada") { conversas[chaveUsuario(d.com)] = []; delete naoLidas[chaveUsuario(d.com)]; }
  else if (d.escopo === "sala") { conversas[chaveSala(d.sala)] = []; delete naoLidas[chaveSala(d.sala)]; }
  else if (d.escopo === "total") { for (const k of Object.keys(conversas)) conversas[k] = []; naoLidas = {}; }
  else if (d.escopo === "usuario") {
    for (const k of Object.keys(conversas)) conversas[k] = conversas[k].filter(m => m.remetente !== d.usuario);
  }
  renderizarLista();
  renderizarConversa();
}

// Mensagens privadas e de salas expiram: some da tela quando passam do prazo.
setInterval(() => {
  const limite = Date.now() - ttlHoras * 3600 * 1000;
  let mudou = false;
  for (const k of Object.keys(conversas)) {
    if (k === MURAL) continue;
    const antes = conversas[k].length;
    conversas[k] = conversas[k].filter(m => !m.hora || new Date(m.hora).getTime() > limite);
    if (conversas[k].length !== antes && k === selecionado) mudou = true;
  }
  if (mudou) renderizarConversa();
}, 60000);

// ---------------------------------------------------------------
// Barra lateral
// ---------------------------------------------------------------
function criarItem(classes, onclick) {
  const div = document.createElement("div");
  div.className = "item " + classes;
  div.onclick = onclick;
  return div;
}
function span(texto, classe) {
  const s = document.createElement("span");
  if (classe) s.className = classe;
  s.textContent = texto;
  return s;
}
function badge(div, chave) {
  if (naoLidas[chave]) div.appendChild(span(String(naoLidas[chave]), "badge-nao-lidas"));
}
function secao(titulo, botao) {
  const div = document.createElement("div");
  div.className = "secao";
  div.appendChild(span(titulo));
  if (botao) div.appendChild(botao);
  return div;
}

function itemUsuario(apelido) {
  const chave = chaveUsuario(apelido);
  const div = criarItem(selecionado === chave ? "selecionado" : "", () => selecionar(chave));
  div.appendChild(span("", "bolinha " + (usuarios.get(apelido) ? "online" : "offline")));
  div.appendChild(span(apelido, "nome-item"));
  badge(div, chave);
  const pino = document.createElement("button");
  const fixo = contatos.has(apelido);
  pino.className = "pino" + (fixo ? " fixo" : "");
  pino.title = fixo ? "Tirar dos contatos" : "Fixar nos contatos";
  pino.textContent = "📌";
  pino.onclick = (e) => { e.stopPropagation(); enviarWs({ tipo: "fixar", apelido, fixo: !fixo }); };
  div.appendChild(pino);
  return div;
}

function ordenarPessoas(lista) {
  return lista.sort((a, b) => {
    const oa = usuarios.get(a), ob = usuarios.get(b);
    if (oa !== ob) return oa ? -1 : 1;
    return a.localeCompare(b);
  });
}

function renderizarLista() {
  const lista = el("lista");
  const busca = el("busca").value.trim().toLowerCase();
  const casa = (nome) => !busca || nome.toLowerCase().includes(busca);
  lista.innerHTML = "";

  const mural = criarItem("mural" + (selecionado === MURAL ? " selecionado" : ""), () => selecionar(MURAL));
  mural.appendChild(span("📢"));
  mural.appendChild(span("Mural de Recados", "nome-item"));
  lista.appendChild(mural);

  // Salas
  const btnCriar = document.createElement("button");
  btnCriar.textContent = "+ Criar";
  btnCriar.onclick = abrirCriarSala;
  lista.appendChild(secao("Salas", btnCriar));
  const listaSalas = [...salas.values()].filter(s => casa(s.nome))
    .sort((a, b) => (a.membro !== b.membro ? (a.membro ? -1 : 1) : a.nome.localeCompare(b.nome)));
  if (!listaSalas.length) lista.appendChild(Object.assign(document.createElement("div"), { className: "dica-vazia", textContent: busca ? "Nenhuma sala encontrada." : "Nenhuma sala ainda." }));
  listaSalas.forEach(s => {
    const chave = chaveSala(s.nome);
    const div = criarItem((s.membro ? "" : "fora ") + (selecionado === chave ? "selecionado" : ""),
      () => s.membro ? selecionar(chave) : abrirSala(s.nome));
    div.appendChild(span(s.membro ? "💬" : "🔒"));
    div.appendChild(span(s.nome, "nome-item"));
    badge(div, chave);
    div.appendChild(span(String(s.membros), "sub"));
    lista.appendChild(div);
  });

  // Contatos (fixados)
  const outros = [...usuarios.keys()].filter(a => a !== meuNome && casa(a));
  const fixados = ordenarPessoas(outros.filter(a => contatos.has(a)));
  lista.appendChild(secao("Contatos"));
  if (!fixados.length) lista.appendChild(Object.assign(document.createElement("div"), { className: "dica-vazia", textContent: busca ? "Nenhum contato encontrado." : "Toque em 📌 para fixar alguém aqui." }));
  fixados.forEach(a => lista.appendChild(itemUsuario(a)));

  // Todos
  const todos = ordenarPessoas(outros.filter(a => !contatos.has(a)));
  lista.appendChild(secao("Todos (" + todos.length + ")"));
  todos.slice(0, LIMITE_LISTA).forEach(a => lista.appendChild(itemUsuario(a)));
  if (todos.length > LIMITE_LISTA) {
    lista.appendChild(Object.assign(document.createElement("div"), { className: "mais", textContent: "… e mais " + (todos.length - LIMITE_LISTA) + ". Use a busca." }));
  }

  const totalNaoLidas = Object.values(naoLidas).reduce((a, b) => a + b, 0);
  el("menu-ponto").classList.toggle("escondido", !totalNaoLidas);
  try {
    if (navigator.setAppBadge) totalNaoLidas ? navigator.setAppBadge(totalNaoLidas) : navigator.clearAppBadge();
  } catch (e) {}
}

el("busca").addEventListener("input", renderizarLista);

function abrirMenu(abrir) {
  el("sidebar").classList.toggle("aberto", abrir);
  el("veu").classList.toggle("aberto", abrir);
}
el("menu").onclick = () => abrirMenu(!el("sidebar").classList.contains("aberto"));
el("veu").onclick = () => abrirMenu(false);

// ---------------------------------------------------------------
// Conversa aberta
// ---------------------------------------------------------------
function selecionar(chave, fecharMenu = true) {
  selecionado = chave;
  delete naoLidas[chave];
  if (ehPrivada(chave)) enviarWs({ tipo: "marcar_lidas", interlocutor: nomeDaChave(chave) });
  atualizarTitulo();
  atualizarEntrada();
  renderizarLista();
  renderizarConversa();
  if (fecharMenu) abrirMenu(false);
  fecharNotificacoes(chave);
  if (!el("texto").disabled && window.innerWidth > 700) el("texto").focus();
}

function atualizarTitulo() {
  const acao = el("titulo-acao");
  acao.classList.add("escondido");
  let nome, sub;
  if (selecionado === MURAL) {
    nome = "📢 Mural de Recados";
    sub = meuPapel >= ADMIN ? "Recados para todos. Só Admins escrevem aqui." : "Recados dos Admins. Só Admins escrevem aqui.";
  } else if (ehSala(selecionado)) {
    const s = salas.get(nomeDaChave(selecionado));
    nome = "💬 " + nomeDaChave(selecionado);
    sub = (s ? "Dono: " + s.dono + " · " + s.membros + (s.membros === 1 ? " membro" : " membros") + " · " : "") + "⏳ mensagens somem em " + ttlHoras + "h";
    if (s) {
      acao.textContent = s.dono === meuNome ? "Apagar sala" : "Sair da sala";
      acao.classList.remove("escondido");
    }
  } else {
    nome = "👤 " + nomeDaChave(selecionado);
    sub = "⏳ Mensagens privadas somem após " + ttlHoras + " horas";
  }
  el("titulo-nome").textContent = nome;
  el("titulo-sub").textContent = sub;
}

function atualizarEntrada() {
  const input = el("texto");
  let ativo = conectado();
  let dica = "Mensagem...";
  if (selecionado === MURAL) {
    dica = meuPapel >= ADMIN ? "Recado para todos..." : "📢 Só Admins escrevem aqui";
  } else if (ehSala(selecionado)) {
    dica = "Mensagem para a sala " + nomeDaChave(selecionado) + "...";
  } else {
    dica = "Mensagem para " + nomeDaChave(selecionado) + "...";
  }
  if (ativo && bloqueadoAte) dica = "🚫 Envio travado até " + formatarHora(bloqueadoAte);
  input.disabled = !ativo;
  el("enviar").disabled = !ativo;
  input.placeholder = dica;
}

function formatarHora(hora) {
  const d = new Date(hora);
  if (isNaN(d)) return "";
  const hm = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  return d.toDateString() === new Date().toDateString() ? hm
    : d.toLocaleDateString([], {day: "2-digit", month: "2-digit"}) + " " + hm;
}

function renderizarConversa() {
  const container = el("mensagens");
  container.innerHTML = "";
  const msgs = conversas[selecionado] || [];
  if (!msgs.length && meuNome) {
    const vazio = document.createElement("div");
    vazio.className = "vazio";
    vazio.textContent = selecionado === MURAL ? "Nenhum recado ainda."
      : "Nenhuma mensagem. As mensagens aqui somem após " + ttlHoras + " horas.";
    container.appendChild(vazio);
  }
  msgs.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.classe;
    if (m.remetente && m.classe === "recebida" && selecionado !== chaveUsuario(m.remetente)) {
      const n = document.createElement("div");
      n.className = "nome"; n.textContent = m.remetente;
      div.appendChild(n);
    }
    const c = document.createElement("div"); c.textContent = m.texto;
    div.appendChild(c);
    if (m.hora) {
      const h = document.createElement("div");
      h.className = "hora"; h.textContent = formatarHora(m.hora);
      div.appendChild(h);
    }
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function enviarMensagem() {
  const input = el("texto");
  const texto = input.value;
  if (!texto.trim() || !conectado()) return;
  if (selecionado === MURAL && meuPapel < ADMIN && !texto.trim().startsWith("/")) {
    adicionarSistema("📢 Somente Admins podem escrever no Mural de Recados. Converse no privado ou numa sala.");
    limparTexto();
    return;
  }
  const dados = { texto, para: null, sala: null };
  if (ehSala(selecionado)) dados.sala = nomeDaChave(selecionado);
  else if (ehPrivada(selecionado)) dados.para = nomeDaChave(selecionado);
  enviarWs(dados);
  limparTexto();
  input.focus();
}

// A caixa cresce conforme o texto (até o limite do CSS).
function ajustarAltura() {
  const t = el("texto");
  t.style.height = "auto";
  t.style.height = Math.max(46, t.scrollHeight + 2) + "px";
}
function limparTexto() { el("texto").value = ""; ajustarAltura(); }

// Computador: Enter envia, Shift+Enter pula linha. Celular: Enter pula linha, envia pelo botão.
const telaDeToque = window.matchMedia("(pointer: coarse)").matches;
el("enviar").onclick = enviarMensagem;
el("texto").addEventListener("input", ajustarAltura);
el("texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !telaDeToque && !e.isComposing) {
    e.preventDefault();
    enviarMensagem();
  }
});

// ---------------------------------------------------------------
// App instalável (PWA) e notificações (Web Push)
// ---------------------------------------------------------------
const pushSuportado = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const instalado = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let promptInstalar = null;
let conversaPendente = new URLSearchParams(location.search).get("c");
if (conversaPendente) history.replaceState(null, "", "/");

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data && e.data.tipo === "abrir") abrirChave(e.data.chave);
  });
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  promptInstalar = e;
  atualizarAviso();
});
window.addEventListener("appinstalled", () => { promptInstalar = null; atualizarAviso(); });

function enviarVisibilidade() {
  enviarWs({ tipo: "visibilidade", visivel: document.visibilityState === "visible" });
}
document.addEventListener("visibilitychange", () => {
  enviarVisibilidade();
  if (document.visibilityState === "visible") fecharNotificacoes(selecionado);
});

function abrirChave(chave) {
  if (!meuNome) { conversaPendente = chave; return; }
  const ok = chave === MURAL
    || (ehPrivada(chave) && usuarios.has(nomeDaChave(chave)))
    || (ehSala(chave) && salas.get(nomeDaChave(chave))?.membro);
  selecionar(ok ? chave : MURAL);
}

async function fecharNotificacoes(chave) {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) (await reg.getNotifications({ tag: chave })).forEach(n => n.close());
  } catch (e) {}
}

function chaveParaBytes(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const bruto = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(bruto, c => c.charCodeAt(0));
}

async function inscreverPush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const { chave } = await (await fetch("/api/push/chave")).json();
    if (!chave) return;
    const chaveBytes = chaveParaBytes(chave);
    let inscricao = await reg.pushManager.getSubscription();
    // Se o servidor trocou de chave, refaz a inscrição.
    const atual = inscricao?.options?.applicationServerKey;
    if (inscricao && atual && new Uint8Array(atual).toString() !== chaveBytes.toString()) {
      await inscricao.unsubscribe();
      inscricao = null;
    }
    if (!inscricao) inscricao = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveBytes });
    await fetch("/api/push/inscrever", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(inscricao.toJSON()),
    });
  } catch (e) {
    console.warn("push indisponível:", e);
  }
}

async function cancelarPush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const inscricao = reg && await reg.pushManager.getSubscription();
    if (inscricao) {
      await fetch("/api/push/cancelar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ endpoint: inscricao.endpoint }),
      });
    }
  } catch (e) {}
}

function avisoDispensado() {
  try { return localStorage.getItem("chat_aviso_app") === "fechado"; } catch (e) { return false; }
}

function atualizarAviso() {
  const precisaNotif = pushSuportado && Notification.permission === "default";
  const dicaIOS = ehIOS && !instalado && !pushSuportado;
  const podeInstalar = !!promptInstalar;
  let texto = "";
  if (precisaNotif) texto = "🔔 Receba um aviso quando chegar mensagem, mesmo com o chat fechado.";
  else if (dicaIOS) texto = "📲 No iPhone, toque em Compartilhar ⬆️ e depois em “Adicionar à Tela de Início” para instalar o app e receber notificações.";
  else if (podeInstalar) texto = "📲 Instale o chat como app no seu aparelho.";
  const mostrar = !!meuNome && !!texto && !avisoDispensado();
  el("aviso-app").classList.toggle("escondido", !mostrar);
  el("aviso-texto").textContent = texto;
  el("btn-notif").classList.toggle("escondido", !precisaNotif);
  el("btn-instalar").classList.toggle("escondido", !podeInstalar);
}

el("btn-notif").onclick = async () => {
  const permissao = await Notification.requestPermission();
  if (permissao === "granted") {
    await inscreverPush();
    adicionarSistema("🔔 Notificações ativadas neste aparelho.");
  } else if (permissao === "denied") {
    adicionarSistema("🔕 Notificações bloqueadas. Para ativar, libere nas configurações do navegador para este site.");
  }
  atualizarAviso();
};
el("btn-instalar").onclick = async () => {
  if (!promptInstalar) return;
  promptInstalar.prompt();
  await promptInstalar.userChoice.catch(() => {});
  promptInstalar = null;
  atualizarAviso();
};
el("aviso-fechar").onclick = () => {
  try { localStorage.setItem("chat_aviso_app", "fechado"); } catch (e) {}
  atualizarAviso();
};

renderizarLista();
conectar();
</script>
